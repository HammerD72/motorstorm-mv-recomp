name: Source audit
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_repository.py --self-test
      - run: python scripts/check_repository.py
      - run: python scripts/check_docs.py
      - name: Native window readiness regression
        run: python scripts/check_native_window.py
      - run: python -m pip install psutil
      - name: Screen-gated menu replay regression
        run: python scripts/check_menu_replay.py
      - name: Bounded frame capture selector
        run: python scripts/check_rsx_capture_schedule.py
      - name: Actual indexed strip restart regression
        run: python scripts/check_rsx_restart.py
      - name: Actual indexed vertex reuse regression
        run: python scripts/check_rsx_indexed_strip.py
      - name: Actual packed vertex fetch regression
        run: python scripts/check_rsx_vertex.py
      - name: Actual fragment source modifier regression
        run: python scripts/check_rsx_fp_source.py
      - name: Typed guest surface readback regression
        run: python scripts/check_rsx_cpu_surface.py
      - name: Actual AA surface layout regression
        run: python scripts/check_rsx_surface_layout.py
      - name: Memory capacity contract
        run: python scripts/check_memory_capacity.py
      - name: Container allocation ABI and accounting
        run: python scripts/check_memory_container.py
      - name: Actual SPURS guest-field contract
        run: python scripts/check_spurs_guest_fields.py
      - name: Scalar-u64 SPURS policy arguments
        run: python scripts/check_spurs_policy_arguments.py
      - name: Productive SPU interrupt returns
        run: python scripts/check_spu_iret_progress.py
      - name: Explicit SPURS dispatch identity
        run: python scripts/check_task_dispatch_identity.py
      - name: Check task exit lifecycle and runner reason
        run: python scripts/check_task_lifecycle.py
      - name: Check complete task cleanup API
        run: python scripts/check_task_exit_source.py
  capture-observer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_havok_observer.py
      - run: python scripts/check_bike_observer.py
      - run: python -m pip install psutil
      - name: Vertex homogeneous clipping pixel regression (WARP)
        run: python scripts/check_rsx_clip.py
      - name: Packed XY16F render-target sampling (WARP)
        run: python scripts/check_rsx_texture_alias.py
      - name: Screen-gated menu replay regression
        run: python scripts/check_menu_replay.py
      - name: Bounded frame capture selector
        run: python scripts/check_rsx_capture_schedule.py
      - name: Actual indexed strip restart regression
        run: python scripts/check_rsx_restart.py
      - name: Actual indexed vertex reuse regression
        run: python scripts/check_rsx_indexed_strip.py
      - name: Actual packed vertex fetch regression
        run: python scripts/check_rsx_vertex.py
      - name: Actual fragment source modifier regression
        run: python scripts/check_rsx_fp_source.py
      - name: Typed guest surface readback regression
        run: python scripts/check_rsx_cpu_surface.py
      - name: Actual AA surface layout regression
        run: python scripts/check_rsx_surface_layout.py
      - name: Load-time observer/report regression
        run: python scripts/check_loadtime.py
      - name: Texture snapshot regression
        run: python scripts/check_texture_capture.py
      - name: Memory capacity contract
        run: python scripts/check_memory_capacity.py
      - name: Container allocation ABI and accounting
        run: python scripts/check_memory_container.py
      - name: Actual SPURS guest-field contract
        run: python scripts/check_spurs_guest_fields.py
      - name: Scalar-u64 SPURS policy arguments
        run: python scripts/check_spurs_policy_arguments.py
      - name: Productive SPU interrupt returns
        run: python scripts/check_spu_iret_progress.py
      - name: Explicit SPURS dispatch identity
        run: python scripts/check_task_dispatch_identity.py
      - name: Check task exit lifecycle and runner reason
        run: python scripts/check_task_lifecycle.py
      - name: Check complete task cleanup API
        run: python scripts/check_task_exit_source.py
