name: Source audit
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install psutil PyYAML
      - run: python scripts/check_repository.py --self-test
      - run: python scripts/check_repository.py
      - run: python scripts/check_docs.py
      - name: Native window readiness regression
        run: python scripts/check_native_window.py
      - name: Screen-gated menu replay regression
        run: python scripts/check_menu_replay.py
      - name: Run retention filesystem safety
        run: python scripts/check_run_retention.py
      - name: Bounded frame capture selector
        run: python scripts/check_rsx_capture_schedule.py
      - name: Latest-five retention filesystem safety
        run: python scripts/check_latest_runs.py
      - name: Long-lived SPU decrementer arithmetic
        run: python scripts/check_spu_decrementer.py
      - name: Actual texture lookup and phase accounting
        run: python scripts/check_rsx_texture_profile.py
      - name: Exact SPU fingerprint cache and worker cleanup
        run: python scripts/check_spu_fingerprint_cache.py
      - name: Resident SPU compiled lookup ownership
        run: python scripts/check_spu_resident_lookup.py
      - name: Native world transforms and independent FP oracle
        run: python scripts/check_native_world_transforms.py
      - name: Native visibility planes and independent negative controls
        run: python scripts/check_native_visibility_planes.py
      - name: Native particle scan and independent scalar oracle
        run: python scripts/check_native_threshold_scan.py
      - name: Private particle code binding and output preservation
        run: python scripts/check_native_particle_binding.py
      - name: Native visibility adapter and full-state negative controls
        run: python scripts/check_native_visibility_adapter.py
      - name: Verified SPU visibility binding and code/data guards
        run: python scripts/check_native_visibility_binding.py
      - name: Verified native game binding and input isolation
        run: python scripts/check_native_game_binding.py
      - name: Native scene transaction and original fallback
        run: python scripts/check_native_scene.py
      - name: Native job dependency wait and negative controls
        run: python scripts/check_native_job_wait.py
      - name: Guarded native leaf interpreter dispatch
        run: python scripts/check_native_leaf_dispatch.py
      - name: Actual indexed strip restart regression
        run: python scripts/check_rsx_restart.py
      - name: Actual indexed vertex reuse regression
        run: python scripts/check_rsx_indexed_strip.py
      - name: Actual packed vertex fetch regression
        run: python scripts/check_rsx_vertex.py
      - name: Actual fragment source modifier regression
        run: python scripts/check_rsx_fp_source.py
      - name: Typed guest surface readback regression
        run: python scripts/check_rsx_cpu_surface.py
      - name: CPU surface latency accounting regression
        run: python scripts/check_cpu_surface_profile.py
      - name: Actual AA surface layout regression
        run: python scripts/check_rsx_surface_layout.py
      - name: Memory capacity contract
        run: python scripts/check_memory_capacity.py
      - name: Container allocation ABI and accounting
        run: python scripts/check_memory_container.py
      - name: Actual SPURS guest-field contract
        run: python scripts/check_spurs_guest_fields.py
      - name: Scalar-u64 SPURS policy arguments
        run: python scripts/check_spurs_policy_arguments.py
      - name: Prepared native vertex fetch and actual work controls
        run: python scripts/check_vertex_prepared.py --mutants
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vertex-prepared-logs-${{ runner.os }}
          retention-days: 5
          path: |
            build/self-tests/vertex-prepared/**/*.log
            build/self-tests/vertex-prepared/**/*.json
      - name: Fragment snapshot decisions and historical controls
        run: python scripts/check_fp_snapshot.py --mutants
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fp-snapshot-logs-${{ runner.os }}
          retention-days: 5
          path: |
            build/self-tests/fp-snapshot/**/*.log
            build/self-tests/fp-snapshot/**/*.json
      - name: SPU execution observations and native admission controls
        run: python scripts/check_spu_execution_observer.py --mutants --syntax
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spu-execution-observers-${{ runner.os }}
          retention-days: 5
          path: |
            build/self-tests/spu-execution-observers/**/*.log
            build/self-tests/spu-execution-observers/**/*.json
      - name: Actual atomic observations and specific negative controls
        run: python scripts/check_native_atomic_observer.py --mutants --syntax
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-atomic-observers-${{ runner.os }}
          retention-days: 5
          path: |
            build/self-tests/native-atomic-observers/**/*.log
            build/self-tests/native-atomic-observers/**/*.json
      - name: Bounded native job trace and actual negative controls
        run: python scripts/check_native_job_trace.py --mutants
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-job-trace-logs-${{ runner.os }}
          retention-days: 5
          path: |
            build/self-tests/native-job-trace/**/*.log
            build/self-tests/native-job-trace/**/*.json
      - name: Bounded native policy admission and actual negative controls
        run: python scripts/check_spurs_scheduler.py --mutants
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduler-logs-${{ runner.os }}
          retention-days: 5
          path: |
            build/self-tests/spurs-scheduler/**/*.log
            build/self-tests/spurs-scheduler/**/*.json
      - name: Concurrent policy counters and persistent productivity
        run: python scripts/check_spurs_policy_counters.py --mutants
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-counter-logs-${{ runner.os }}
          retention-days: 5
          path: |
            build/self-tests/spurs-policy-counters/**/*.log
            build/self-tests/spurs-policy-counters/**/*.json
      - name: Productive SPU interrupt returns
        run: python scripts/check_spu_iret_progress.py
      - name: Interpreter thread reporting isolation
        run: python scripts/check_spu_interp_threads.py
      - name: Explicit SPURS dispatch identity
        run: python scripts/check_task_dispatch_identity.py
      - name: Check task exit lifecycle and runner reason
        run: python scripts/check_task_lifecycle.py
      - name: Check complete task cleanup API
        run: python scripts/check_task_exit_source.py
  capture-observer:
